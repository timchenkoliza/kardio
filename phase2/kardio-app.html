<body data-specialty="cardiology">
<header class="global"><div class="brand">KARDIO</div><span class="shell-label">Сборка</span><span class="shell-name" id="shellName">—</span><div class="grow"></div><button class="ghost" id="debugToggle">ID</button><button class="ghost" id="chooseShell">Сменить</button></header>
<div id="root" class="root"></div>
<div id="overlay" class="overlay"><section class="chooser"><div class="eyebrow">Явная пользовательская настройка</div><h1>Выберите рабочую сборку</h1><p>Все три сборки используют один и тот же Golden Set. Данные, источники, сохранённое и закреплённое общие; меняются только навигация, группировка, плотность и композиция.</p><div class="options"><button class="option" data-shell="search_first"><div class="eyebrow">A</div><h2>Search-first Navigator</h2><p>Быстрый вход через поиск, затем источник и действие.</p><span class="pick">Выбрать</span></button><button class="option" data-shell="toolbelt"><div class="eyebrow">B</div><h2>Professional Toolbelt</h2><p>Постоянные профессиональные capabilities и быстрые переключения.</p><span class="pick">Выбрать</span></button><button class="option" data-shell="workspace"><div class="eyebrow">C</div><h2>Knowledge Workspace</h2><p>Темы и коллекции как долговременное рабочее пространство.</p><span class="pick">Выбрать</span></button></div></section></div>
<div class="toast" id="toast"></div>
<script src="./kardio-app.js"></script>
</body>
