<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KARDIO · Multi-shell prototype</title>
<style>
:root{--bg:#f3f4f1;--paper:#fff;--ink:#171916;--muted:#6b6f68;--line:#d7dad3;--soft:#eceee9;--accent:#254f3d;--dark:#20221f;--warn:#8c6a35;--r:16px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}.global{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:12px;padding:7px 12px;background:rgba(249,250,247,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:900;letter-spacing:-.04em}.shell-label{font-size:12px;color:var(--muted)}.shell-name{font-weight:700;white-space:nowrap}.grow{flex:1}.ghost,.solid{border-radius:10px;padding:8px 11px}.ghost{border:1px solid var(--line);background:#fff}.solid{border:1px solid var(--dark);background:var(--dark);color:#fff}.root{min-height:calc(100vh - 52px)}.overlay{position:fixed;inset:52px 0 0;background:rgba(20,22,20,.34);backdrop-filter:blur(5px);z-index:60;display:none;overflow:auto;padding:28px 16px}.overlay.open{display:block}.chooser{max-width:1050px;margin:auto;background:#f9faf7;border-radius:22px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.15)}.chooser h1{font-size:clamp(30px,5vw,54px);line-height:.98;letter-spacing:-.05em;margin:6px 0 12px}.chooser p{color:var(--muted);max-width:720px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.option{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;text-align:left;min-height:220px;display:flex;flex-direction:column}.option.active{outline:2px solid var(--accent);outline-offset:-2px}.option h2{font-size:20px;margin:8px 0}.option p{font-size:13px}.option .pick{margin-top:auto;border:0;border-radius:10px;padding:10px;background:var(--ink);color:#fff;font-weight:700}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:10px}.content{max-width:1180px;margin:auto;padding:22px}.hero{padding:36px 0 18px}.hero h1{font-size:clamp(36px,5.6vw,68px);line-height:.96;letter-spacing:-.055em;margin:7px 0 14px}.lead{font-size:16px;color:var(--muted);max-width:720px}.search{display:flex;background:#fff;border:1px solid #cfd3cb;border-radius:16px;overflow:hidden}.search input{flex:1;min-width:0;border:0;outline:0;padding:14px 15px;background:transparent}.search button{border:0;background:var(--ink);color:#fff;padding:0 18px}.jobs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0 24px}.job,.card,.tile{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left}.job b,.tile b{display:block;margin-bottom:6px}.job small,.tile small,.muted{color:var(--muted)}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card h2,.card h3{margin:3px 0 8px}.rows{display:grid}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row small{display:block;color:var(--muted);margin-top:3px}.row-actions{display:flex;gap:6px;align-items:start}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:11px}.mini.on{background:var(--dark);color:#fff;border-color:var(--dark)}.provenance{background:var(--soft);border-radius:11px;padding:11px;margin-top:10px;font-size:12px}.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.source-list{display:grid}.source-row{display:grid;grid-template-columns:1fr 150px 120px;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.source-row:first-child{border-top:0}.official{border-left:3px solid #244d3b;padding-left:10px}.commercial{border-left:3px solid var(--warn);padding-left:10px}.toolbelt{min-height:calc(100vh - 52px);display:grid;grid-template-columns:86px minmax(0,1fr) 285px}.rail{background:var(--dark);color:#fff;padding:12px 8px;display:flex;flex-direction:column;gap:7px}.rail button{border:0;background:transparent;color:#bfc2bc;border-radius:10px;padding:11px 5px;font-size:11px}.rail button.active{background:#363935;color:#fff}.rail .space{flex:1}.tool-main{padding:18px 22px 64px}.side{border-left:1px solid var(--line);padding:18px 14px;background:#f8f9f6}.workspace{min-height:calc(100vh - 52px);display:grid;grid-template-columns:220px minmax(0,1fr) 270px}.leftnav{padding:18px 12px;background:#e9ece6;border-right:1px solid var(--line)}.leftnav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;margin:2px 0}.leftnav button.active{background:#fff;font-weight:700}.workspace-main{padding:18px 22px 64px}.collections{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.statusline{font-size:12px;color:var(--muted);margin-top:12px}.bottom{display:none}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#151714;color:#fff;padding:9px 13px;border-radius:999px;z-index:90;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:980px){.toolbelt,.workspace{grid-template-columns:76px minmax(0,1fr)}.side{display:none}.workspace .leftnav{width:190px}.workspace{grid-template-columns:190px minmax(0,1fr)}.two{grid-template-columns:1fr}.tool-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.content,.tool-main,.workspace-main{padding:14px 12px 82px}.jobs{grid-template-columns:repeat(2,1fr)}.toolbelt,.workspace{display:block}.rail,.leftnav{display:none}.bottom{display:flex;position:fixed;left:8px;right:8px;bottom:8px;background:var(--dark);padding:6px;border-radius:14px;z-index:35}.bottom button{flex:1;border:0;background:transparent;color:#bec1bb;padding:9px 3px;font-size:10px}.bottom button.active{background:#363935;color:#fff;border-radius:9px}.tool-grid,.collections{grid-template-columns:1fr}.source-row{grid-template-columns:1fr}.shell-label{display:none}.options{grid-template-columns:1fr}.chooser{padding:16px}.overlay{padding:10px}.global{padding:7px 8px}.global .ghost{padding:8px}.hero h1{font-size:42px}}
@media(max-width:440px){.jobs{grid-template-columns:1fr}.shell-name{max-width:105px;overflow:hidden;text-overflow:ellipsis}.search{display:grid}.search button{height:44px}.global .brand{font-size:16px}}
</style>
</head>
<body>
<header class="global"><div class="brand">KARDIO</div><span class="shell-label">Сборка</span><span class="shell-name" id="shellName">—</span><div class="grow"></div><button class="ghost" id="chooseShell">Сменить</button></header>
<div id="root" class="root"></div>
<div id="overlay" class="overlay"><section class="chooser"><div class="eyebrow">Явная пользовательская настройка</div><h1>Выберите рабочую сборку</h1><p>Данные, поиск, сохранённое, закреплённое и источники общие. Меняется только способ организации интерфейса. KARDIO не переключает сборку автоматически.</p><div class="options">
<button class="option" data-shell="search_first"><div class="eyebrow">A</div><h2>Search-first Navigator</h2><p>Быстрый первый ответ: поиск → источник → действие.</p><span class="pick">Выбрать</span></button>
<button class="option" data-shell="toolbelt"><div class="eyebrow">B</div><h2>Professional Toolbelt</h2><p>Постоянные профессиональные capabilities под рукой.</p><span class="pick">Выбрать</span></button>
<button class="option" data-shell="workspace"><div class="eyebrow">C</div><h2>Knowledge Workspace</h2><p>Темы и коллекции как долговременное рабочее пространство.</p><span class="pick">Выбрать</span></button>
</div></section></div><div class="toast" id="toast"></div>
<script>
const STORAGE='kardio.prototype.v3';
const defaults={shell:null,view:'home',query:'ХСН: найти актуальную рекомендацию и первоисточник',recent:['ХСН · клинические рекомендации','eGFR · калькулятор','РКО · профессиональный источник'],saved:['ХСН · клинические рекомендации'],pinned:['Клинические рекомендации','Калькуляторы','РКО']};
let state=load();
const catalog={
 guideline:{title:'Хроническая сердечная недостаточность',kind:'Official / guideline',note:'Медицинский текст намеренно не выдумывается. Production-ответ должен быть основан на утверждённом источнике.'},
 society:{title:'Российское кардиологическое общество · ХСН',kind:'Professional society',note:'Observed in research ≠ clinical endorsement.'},
 editorial:{title:'Кардиология · материалы по ХСН',kind:'Journal / editorial',note:'Редакционный класс визуально отделён от official/guideline.'}
};
const sources=[['Российское кардиологическое общество','Профобщество','trust: verify'],['Кардиология журнал','Издание','editorial'],['1Med.TV Первый медицинский канал','Материалы','professional'],['Doc Сфера (от фарм компаний)','Фарма','commercial'],['Добавленный пользователем источник','User-owned','unverified']];
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{return {...defaults}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function say(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function setShell(shell){state.shell=shell;state.view='home';save();render();closeChooser();say('Сборка изменена. Ваши данные сохранены.')}
function setView(view){state.view=view;save();render();scrollTo(0,0)}
function toggleSaved(name){state.saved=state.saved.includes(name)?state.saved.filter(x=>x!==name):[...state.saved,name];save();render();say(state.saved.includes(name)?'Сохранено':'Удалено из сохранённого')}
function addRecent(name){state.recent=[name,...state.recent.filter(x=>x!==name)].slice(0,6);save()}
function togglePin(name){state.pinned=state.pinned.includes(name)?state.pinned.filter(x=>x!==name):[...state.pinned,name];save();render();say(state.pinned.includes(name)?'Закреплено':'Откреплено')}
function search(){const input=document.querySelector('[data-query]');if(input)state.query=input.value.trim()||state.query;addRecent(state.query);state.view='results';save();render()}
function openChooser(){document.getElementById('overlay').classList.add('open');document.querySelectorAll('.option').forEach(x=>x.classList.toggle('active',x.dataset.shell===state.shell))}
function closeChooser(){if(state.shell)document.getElementById('overlay').classList.remove('open')}
function searchBox(){return `<div class="search"><input data-query value="${esc(state.query)}" aria-label="Поиск"><button data-action="search">Найти</button></div>`}
function recentCard(){return `<section class="card"><div class="eyebrow">Недавнее · shared state</div><div class="rows">${state.recent.map(x=>`<div class="row"><div><b>${esc(x)}</b><small>Сохраняется при смене сборки</small></div><div class="row-actions">${saveButton(x)}</div></div>`).join('')}</div></section>`}
function updateCard(){return `<section class="card"><div class="eyebrow">Важное обновление</div><h3>РКО · ХСН</h3><p class="muted">Профессиональное обновление · демо</p><div class="provenance">Почему показано: Кардиология → ХСН → источник выбран пользователем / редакцией.</div></section>`}
function saveButton(name){return `<button class="mini ${state.saved.includes(name)?'on':''}" data-save="${attr(name)}">${state.saved.includes(name)?'Сохранено':'Сохранить'}</button>`}
function jobs(){return `<div class="jobs"><button class="job" data-view="results"><b>Клинические рекомендации</b><small>Найти раздел и первоисточник</small></button><button class="job" data-view="tools"><b>Калькуляторы</b><small>Профессиональные инструменты</small></button><button class="job" data-view="tools"><b>Препараты</b><small>Проверить препарат / МНН</small></button><button class="job" data-view="route"><b>Маршрутизация / ВМП</b><small>Найти маршрут или требования</small></button></div>`}
function results(){return `<section class="hero"><div class="eyebrow">Результаты поиска</div><h1>ХСН</h1><p class="lead">Одинаковые search objects во всех трёх сборках.</p></section><div class="two"><section class="card rows">${Object.values(catalog).map((x,i)=>`<article class="row ${i===0?'official':''}"><div><div class="eyebrow">${x.kind}</div><b>${x.title}</b><small>${x.note}</small></div><div class="row-actions">${saveButton(x.title)}${i===0?'<button class="mini" data-view="answer">Открыть</button>':''}</div></article>`).join('')}</section><aside class="card"><div class="eyebrow">Trust separation</div><h3>Источник — часть ответа</h3><p class="muted">Official, society, editorial, commercial и user-added не смешиваются.</p></aside></div>`}
function answer(){const x=catalog.guideline;return `<section class="hero"><div class="eyebrow">${x.kind}</div><h1>${x.title}</h1><p class="lead">Демо-ответ не содержит выдуманного медицинского утверждения.</p></section><section class="card official"><h2>Ответ по утверждённому источнику</h2><p>${x.note}</p><div class="provenance"><b>Источник:</b> клинические рекомендации · первоисточник в один переход. Дата/версия — только если реально известны.</div>${saveButton(x.title)}</section>`}
function tools(){return `<section class="hero"><div class="eyebrow">Shared capabilities</div><h1>Инструменты</h1></section><div class="tool-grid"><section class="card"><h2>eGFR · демо</h2><p class="muted">Production-источник и реализация требуют clinical/legal approval.</p>${pinButton('Калькуляторы')}</section><section class="card"><h2>Проверить препарат / МНН</h2><p class="muted">Provider пока UNKNOWN.</p>${pinButton('Препараты')}</section><section class="card"><h2>Маршрутизация / ВМП</h2><p class="muted">Source model и jurisdiction coverage пока UNKNOWN.</p>${pinButton('Маршрутизация / ВМП')}</section></div>`}
function pinButton(name){return `<button class="mini ${state.pinned.includes(name)?'on':''}" data-pin="${attr(name)}">${state.pinned.includes(name)?'Закреплено':'Закрепить'}</button>`}
function sourceRegistry(){return `<section class="hero"><div class="eyebrow">Source registry</div><h1>Источники</h1></section><section class="card source-list">${sources.map((s,i)=>`<div class="source-row ${i===3?'commercial':''}"><div><b>${s[0]}</b><small>Observed / user-owned research layer</small></div><span>${s[1]}</span><span class="tag">${s[2]}</span></div>`).join('')}</section>`}
function route(){return `<section class="hero"><div class="eyebrow">Referral / VMP</div><h1>Маршрутизация / ВМП</h1><p class="lead">Source model и jurisdiction coverage пока UNKNOWN. В прототипе не выдумываются.</p></section><section class="card"><p>Этот shared capability будет одинаков по данным и правилам во всех shell.</p></section>`}
function sharedView(){if(state.view==='results')return results();if(state.view==='answer')return answer();if(state.view==='tools')return tools();if(state.view==='sources')return sourceRegistry();if(state.view==='route')return route();return null}
function searchFirst(){const shared=sharedView();if(shared)return `<main class="content">${navTop()}${shared}</main>`;return `<main class="content">${navTop()}<section class="hero"><div class="eyebrow">Search-first Navigator</div><h1>Найти ответ, инструмент или первоисточник.</h1>${searchBox()}<div class="statusline">Источник в один переход · AI не главный экран.</div></section>${jobs()}<div class="two">${recentCard()}${updateCard()}</div></main>`}
function navTop(){return `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="mini ${state.view==='home'?'on':''}" data-view="home">Главная</button><button class="mini" data-view="tools">Инструменты</button><button class="mini" data-view="sources">Источники</button><span class="tag">saved ${state.saved.length}</span></div>`}
function toolbelt(){const shared=sharedView();const body=shared||`<section class="hero"><div class="eyebrow">Professional Toolbelt</div><h1>Рабочие инструменты всегда под рукой.</h1><p class="lead">Search остаётся универсальным входом, capabilities — постоянными.</p></section><div class="two">${recentCard()}${updateCard()}</div>`;return `<div class="toolbelt"><aside class="rail"><div class="brand" style="text-align:center;color:#fff;margin:6px 0 12px">K</div>${railBtn('home','Поиск')}${railBtn('results','КР')}${railBtn('tools','Tools')}${railBtn('route','ВМП')}${railBtn('sources','Sources')}<div class="space"></div><span class="tag" style="color:#fff;border-color:#555">saved ${state.saved.length}</span></aside><main class="tool-main">${searchBox()}${body}</main><aside class="side"><div class="eyebrow">Pinned · shared state</div><h3>Мой рабочий минимум</h3><div class="rows">${state.pinned.map(x=>`<div class="row"><b>${esc(x)}</b></div>`).join('')}</div><div class="provenance">Закреплённое сохраняется при смене shell.</div></aside></div>${bottomNav()}`}
function railBtn(view,label){return `<button data-view="${view}" class="${state.view===view?'active':''}">${label}</button>`}
function workspace(){const shared=sharedView();const body=shared||`<section class="hero"><div class="eyebrow">Knowledge Workspace</div><h1>Профессиональное знание как рабочее пространство.</h1><p class="lead">Durable unit — тема / коллекция. Search остаётся глобальным.</p></section><div class="two"><section class="card"><div class="eyebrow">Рабочая тема · demo</div><h2>ХСН</h2><div class="collections"><button class="tile" data-view="results"><b>Клинические рекомендации</b><small>Official / guideline</small></button><button class="tile" data-view="tools"><b>Инструменты</b><small>Calculator / references</small></button><button class="tile" data-view="sources"><b>Источники</b><small>Source registry</small></button><button class="tile" data-view="home"><b>Сохранённое</b><small>${state.saved.length} items · shared</small></button></div></section>${recentCard()}</div>`;return `<div class="workspace"><aside class="leftnav"><div class="brand" style="margin:4px 8px 22px">KARDIO</div>${leftBtn('home','Обзор')}${leftBtn('results','ХСН · демо')}${leftBtn('tools','Инструменты')}${leftBtn('sources','Источники')}<div class="eyebrow" style="margin:18px 10px 6px">Мои коллекции</div><button data-view="home">Сохранённое · ${state.saved.length}</button></aside><main class="workspace-main">${searchBox()}${body}</main><aside class="side"><div class="eyebrow">Source stack</div><h3>Общий provenance</h3><p class="muted">Official / society / editorial / commercial / user-added.</p><div class="provenance">Выбор workspace не меняет trust rules.</div></aside></div>${bottomNav()}`}
function leftBtn(view,label){return `<button data-view="${view}" class="${state.view===view?'active':''}">${label}</button>`}
function bottomNav(){return `<nav class="bottom"><button data-view="home" class="${state.view==='home'?'active':''}">Главная</button><button data-view="results" class="${state.view==='results'?'active':''}">КР</button><button data-view="tools" class="${state.view==='tools'?'active':''}">Tools</button><button data-view="sources" class="${state.view==='sources'?'active':''}">Sources</button></nav>`}
function render(){document.getElementById('shellName').textContent=state.shell?({search_first:'Search-first',toolbelt:'Toolbelt',workspace:'Workspace'}[state.shell]):'не выбрана';const root=document.getElementById('root');root.innerHTML=state.shell==='toolbelt'?toolbelt():state.shell==='workspace'?workspace():searchFirst();if(!state.shell)openChooser()}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function attr(v){return esc(v).replace(/`/g,'')}
document.addEventListener('click',e=>{const shell=e.target.closest('[data-shell]');if(shell){setShell(shell.dataset.shell);return}const view=e.target.closest('[data-view]');if(view){setView(view.dataset.view);return}const saveB=e.target.closest('[data-save]');if(saveB){toggleSaved(saveB.dataset.save);return}const pin=e.target.closest('[data-pin]');if(pin){togglePin(pin.dataset.pin);return}const action=e.target.closest('[data-action="search"]');if(action){search();return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-query]'))search()});
document.getElementById('chooseShell').onclick=openChooser;document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeChooser()});render();
</script>
</body>
</html>
