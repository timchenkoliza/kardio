name: Control Plane shadow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: control-plane-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shadow-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Self-test release organization
        run: npx vitest run tests/unit/control-plane*.test.ts

      - name: Collect exact PR diff
        run: git diff --name-only "$BASE_SHA" "$HEAD_SHA" > control-plane-changed-files.txt

      - name: Resolve Change contract
        id: contract
        shell: bash
        run: |
          CONTRACT=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^control-plane/changes/.*\.json$' | head -1 || true)
          if [ -z "$CONTRACT" ]; then
            CONTRACT="control-plane-uncontracted-change.json"
            cat > "$CONTRACT" <<JSON
          {
            "change_id": "UNCONTRACTED-${HEAD_SHA}",
            "title": "Uncontracted pull request",
            "problem": "No machine-readable Change contract was supplied",
            "hypothesis": "unknown",
            "guardrails": []
          }
          JSON
          fi
          echo "path=$CONTRACT" >> "$GITHUB_OUTPUT"

      - name: Run deterministic shadow control plane
        run: |
          npx tsx control-plane/runner.ts \
            --contract "${{ steps.contract.outputs.path }}" \
            --changed-files control-plane-changed-files.txt \
            --candidate-sha "$HEAD_SHA" \
            --baseline-sha "$BASE_SHA" \
            --out control-plane-output

      - name: Publish decision summary
        if: always()
        run: |
          if [ -f control-plane-output/human_readable_summary.md ]; then
            cat control-plane-output/human_readable_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-plane-shadow-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: control-plane-output/
          retention-days: 30
          if-no-files-found: warn

# Shadow mode is intentionally advisory: a BLOCK release_decision does not fail the
# workflow. Only a broken control-plane implementation/self-test fails this job.
# Merge/rollout authority stays with the existing human process until shadow exit criteria are met.
