services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kardio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kardio}
      POSTGRES_DB: ${POSTGRES_DB:-kardio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kardio}:${POSTGRES_PASSWORD:-kardio}@db:5432/${POSTGRES_DB:-kardio}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kardio}:${POSTGRES_PASSWORD:-kardio}@db:5432/${POSTGRES_DB:-kardio}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      SESSION_SECURE: ${SESSION_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
